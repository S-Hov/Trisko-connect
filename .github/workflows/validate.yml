name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --nologo
      - name: Build desktop client
        run: dotnet build v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release --nologo
